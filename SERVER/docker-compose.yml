version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: webclinical_mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=123456
      - MYSQL_DATABASE=webclinical
      - MYSQL_USER=webclinical
      - MYSQL_PASSWORD=webclinical123
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: webclinical_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=mysql://webclinical:webclinical123@mysql:3306/webclinical
      - JWT_SECRET=sua_chave_secreta_aqui
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: