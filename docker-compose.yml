version: '3.9'

services:
  db:
    image: ${DB_IMAGE:-postgres:16}
    container_name: webclinical-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-webclinical}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: webclinical-app
    command: sh -c "npm install && npm run prisma:generate && npm run start:dev"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: ${PORT:-3000}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-changeme}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/usr/src/app
    working_dir: /usr/src/app

volumes:
  dbdata:

# For MySQL, override these env vars:
# DB_IMAGE=mysql:8.4
# DB_PORT=3306
# and set DATABASE_URL=mysql://root:root@db:3306/webclinical
# You may also add environment for MySQL:
#   MYSQL_ROOT_PASSWORD: root
#   MYSQL_DATABASE: webclinical

